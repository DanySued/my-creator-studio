services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./api:/app
      - ./media:/media
      - api_data:/data
    environment:
      - MEDIA_DIR=/media
      - DATA_DIR=/data
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    environment:
      - API_URL=http://api:8000          # server-side only (Docker internal)
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_data:
